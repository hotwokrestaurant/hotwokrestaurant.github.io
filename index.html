<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hot Wok Restaurant – Menu</title>
  <meta name="description" content="Menu of Hot Wok Restaurant: fried rice, kottu, noodles, devilled dishes, soups and beverages.">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="color-scheme" content="dark">

  <!-- Montserrat (weights 500, 600, 800), loaded WITHOUT blocking the page:
       - "preconnect" opens the connections to Google Fonts early.
       - media="print" lets the browser download the stylesheet in the background
         without waiting for it; when it arrives, onload switches it on for screens.
       - "display=swap" shows the matched fallback font (css/style.css) straight
         away, then swaps to Montserrat when it has downloaded. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;800&display=swap"></noscript>

  <!-- Open the connection to the database early, so the menu fetch starts faster.
       (This doesn't download anything yet.) -->
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>

  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/menu.js"></script>
  <!-- Fetch menu.js's helper files at the same time as menu.js, instead of one
       after another (saves a round trip, ~2 s on slow 3G). -->
  <link rel="modulepreload" href="js/api.js">
  <link rel="modulepreload" href="js/config.js">
  <link rel="modulepreload" href="js/utils.js">
</head>
<body>
  <!-- Icon set: drawn once here, reused anywhere with <use href="#icon-…">. -->
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-flame" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 2.5c.4 2.9-1 4.6-2.6 6.3C7.8 10.5 6.5 12.3 6.5 15a5.5 5.5 0 0 0 11 0c0-2.2-.9-3.9-2.2-5.3-.3 1.3-1 2.3-2.1 2.8.5-3.4-.3-7-1.2-10Z"/>
    </symbol>
    <symbol id="icon-leaf" viewBox="0 0 24 24">
      <path fill="currentColor" d="M20 4c-7.5 0-13 3.6-13 10.2 0 1.4.4 2.6 1 3.6l-2.7 2.5 1.4 1.4 2.7-2.7c1 .6 2.2 1 3.6 1C19.6 20 20 11.5 20 4Z"/>
    </symbol>
    <symbol id="icon-star" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5l-5.4 3 1.2-6-4.5-4.2 6.1-.7Z"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="6.5"/>
        <path d="M16 16l4.5 4.5"/>
      </g>
    </symbol>
    <!-- Line-art versions (thin strokes) for quiet decoration. -->
    <symbol id="icon-flame-line" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" d="M12 2.5c.4 2.9-1 4.6-2.6 6.3C7.8 10.5 6.5 12.3 6.5 15a5.5 5.5 0 0 0 11 0c0-2.2-.9-3.9-2.2-5.3-.3 1.3-1 2.3-2.1 2.8.5-3.4-.3-7-1.2-10Z"/>
    </symbol>
    <!-- Contact icons: thin line drawings (stroke only). -->
    <symbol id="icon-phone" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M6.6 3.5h2.3l1.4 4-1.8 1.4a11 11 0 0 0 6.6 6.6l1.4-1.8 4 1.4v2.3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.6 5.7a2 2 0 0 1 2-2.2Z"/>
    </symbol>
    <symbol id="icon-chat" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.5a8.5 8.5 0 0 0-7.4 12.7L3.5 20.5l4.4-1.1A8.5 8.5 0 1 0 12 3.5Z"/>
        <path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-1.8-.9-.8.8a4 4 0 0 1-2.3-2.3l.8-.8-.9-1.8Z"/>
      </g>
    </symbol>
    <symbol id="icon-mail" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
        <rect x="3.5" y="5.5" width="17" height="13" rx="1.5"/>
        <path d="M4 6.5l8 6.5 8-6.5"/>
      </g>
    </symbol>
    <symbol id="icon-facebook" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M15 3.5h-2.2A3.8 3.8 0 0 0 9 7.3V10H6.8v3H9v7.5h3.2V13h2.6l.5-3h-3.1V7.6c0-.5.4-.9.9-.9H15Z"/>
    </symbol>
    <symbol id="icon-arrow-up" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/>
    </symbol>
  </svg>

  <a class="skip-link" href="#menu">Skip to menu</a>

  <header class="site-header">
    <!-- The logo IS the page title. logo.webp is the wordmark cropped from logo.jpg
         at full resolution (464×180), shown at 232px wide = sharp on 2× screens. -->
    <h1 class="site-header__logo">
      <img id="logo" src="images/logo.webp" alt="Hot Wok Restaurant" width="464" height="180" fetchpriority="high">
    </h1>
    <p id="tagline" class="site-header__tagline line-frame" hidden></p>
    <p id="notice" class="notice" hidden></p>

    <div class="search">
      <label for="search-input" class="visually-hidden">Search dishes</label>
      <svg class="search__icon" aria-hidden="true" focusable="false"><use href="#icon-search"/></svg>
      <input id="search-input" class="search__input" type="search"
             placeholder="Search dishes" autocomplete="off" enterkeyhint="search">
    </div>

    <!-- Key for the small icons next to dish names, like on a printed menu. -->
    <ul class="legend" aria-label="Icon key">
      <li class="legend__item">
        <svg class="icon icon--spicy" aria-hidden="true" focusable="false"><use href="#icon-flame"/></svg>Spicy
      </li>
      <li class="legend__item">
        <svg class="icon icon--veg" aria-hidden="true" focusable="false"><use href="#icon-leaf"/></svg>Vegetarian
      </li>
      <li class="legend__item">
        <svg class="icon icon--featured" aria-hidden="true" focusable="false"><use href="#icon-star"/></svg>Chef's special
      </li>
    </ul>
  </header>

  <!-- Sticky category tabs. Filled in by js/menu.js -->
  <nav class="category-tabs" aria-label="Menu categories">
    <ul id="category-tabs" class="category-tabs__list"></ul>
  </nav>

  <main id="menu" class="menu" aria-busy="true">
    <!-- Shown only when the latest menu couldn't be loaded and a saved copy is displayed -->
    <p id="status-note" class="status-note" role="status" hidden></p>

    <!-- Skeleton loader: faint placeholder rows shown until the menu is ready -->
    <div id="menu-sections">
      <div class="skeleton" aria-hidden="true">
        <div class="skeleton__title"></div>
        <div class="skeleton__row"></div>
        <div class="skeleton__row"></div>
        <div class="skeleton__row"></div>
      </div>
      <p class="visually-hidden">Loading menu…</p>
    </div>
    <p id="no-results" class="no-results" role="status" hidden>No dishes found.</p>
  </main>

  <!-- Footer: every detail comes from the menu's settings (editable in the admin
       page); blocks and buttons stay hidden when a detail is empty. -->
  <footer class="site-footer">
    <div class="menu-divider line-frame site-footer__divider" aria-hidden="true">
      <svg class="icon menu-divider__icon" focusable="false"><use href="#icon-flame-line"/></svg>
    </div>

    <div id="hours-block" class="site-footer__block" hidden>
      <h2 class="site-footer__heading line-frame"><span>Opening hours</span></h2>
      <p id="opening-hours" class="site-footer__text"></p>
    </div>

    <div id="address-block" class="site-footer__block" hidden>
      <h2 class="site-footer__heading line-frame"><span>Find us</span></h2>
      <p id="address" class="site-footer__text"></p>
      <a id="map-link" class="text-link" href="#" target="_blank" rel="noopener" hidden>Directions</a>
    </div>

    <div id="contact-block" class="site-footer__block" hidden>
      <h2 class="site-footer__heading line-frame"><span>Contact</span></h2>
      <p id="phone-text" class="site-footer__phone" hidden></p>
      <div class="contact-buttons">
        <a id="call-button" class="button contact-button" href="#" hidden>
          <svg class="contact-button__icon" aria-hidden="true" focusable="false"><use href="#icon-phone"/></svg>Call
        </a>
        <a id="whatsapp-button" class="button contact-button" href="#" target="_blank" rel="noopener" hidden>
          <svg class="contact-button__icon" aria-hidden="true" focusable="false"><use href="#icon-chat"/></svg>WhatsApp
        </a>
        <a id="email-button" class="button contact-button" href="#" hidden>
          <svg class="contact-button__icon" aria-hidden="true" focusable="false"><use href="#icon-mail"/></svg>Email
        </a>
        <a id="facebook-button" class="button contact-button" href="#" target="_blank" rel="noopener" hidden>
          <svg class="contact-button__icon" aria-hidden="true" focusable="false"><use href="#icon-facebook"/></svg>Facebook
        </a>
      </div>
    </div>

    <p class="site-footer__small site-footer__closing line-frame"><span>Prices may change without notice.</span></p>
  </footer>

  <button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top" hidden>
    <svg aria-hidden="true" focusable="false"><use href="#icon-arrow-up"/></svg>
  </button>

  <!-- Very old browsers can't run the menu code (ES modules). "nomodule"
       scripts run ONLY in those browsers, so modern phones skip this. -->
  <script nomodule>
    (function () {
      var container = document.getElementById('menu-sections');
      var message = document.createElement('p');
      message.className = 'noscript';
      message.textContent = 'This browser is too old to show the menu. Please update it, or ask our staff for a printed menu.';
      container.textContent = '';
      container.appendChild(message);
    })();
  </script>

  <noscript>
    <p class="noscript">Please turn on JavaScript to see the menu, or ask our staff for a printed menu.</p>
  </noscript>
</body>
</html>
