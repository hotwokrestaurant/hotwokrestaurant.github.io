<!doctype html>
<html lang="en" class="admin-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Hot Wok – Menu Manager</title>
  <meta name="theme-color" content="#0b0b0b">
  <meta name="color-scheme" content="dark">

  <!-- Montserrat without blocking the page (same as index.html): the browser
       downloads it in the background and swaps it in when it arrives. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;800&display=swap"></noscript>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <script type="module" src="js/admin.js"></script>
</head>
<body>
  <!-- All visible text is filled in from js/admin-strings.js (data-i18n="key"). -->

  <!-- The dish tag icons (same shapes as on the customer menu), used in the
       "Dish tags" part of Restaurant details and in the dish form. -->
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-flame" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 2.5c.4 2.9-1 4.6-2.6 6.3C7.8 10.5 6.5 12.3 6.5 15a5.5 5.5 0 0 0 11 0c0-2.2-.9-3.9-2.2-5.3-.3 1.3-1 2.3-2.1 2.8.5-3.4-.3-7-1.2-10Z"/>
    </symbol>
    <symbol id="icon-leaf" viewBox="0 0 24 24">
      <path fill="currentColor" d="M20 4c-7.5 0-13 3.6-13 10.2 0 1.4.4 2.6 1 3.6l-2.7 2.5 1.4 1.4 2.7-2.7c1 .6 2.2 1 3.6 1C19.6 20 20 11.5 20 4Z"/>
    </symbol>
    <symbol id="icon-star" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5l-5.4 3 1.2-6-4.5-4.2 6.1-.7Z"/>
    </symbol>
  </svg>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false">
    <!-- One message with buttons (Undo / Continue), above the normal messages. -->
    <div id="action-toast" class="toast action-toast" hidden></div>
  </div>
  <p id="offline-banner" class="offline-banner" role="status" data-i18n="offlineBanner" hidden></p>

  <!-- Screen: loading -->
  <section id="screen-loading" class="screen screen--center">
    <span class="spinner spinner--large" aria-hidden="true"></span>
    <p data-i18n="loading"></p>
  </section>

  <!-- Screen: log in -->
  <section id="screen-login" class="screen" hidden>
    <img class="admin-logo" src="images/logo.webp" alt="Hot Wok Restaurant" width="464" height="180">
    <h1 class="screen__title" data-i18n="appName"></h1>
    <p class="screen__intro" data-i18n="loginIntro"></p>

    <form id="login-form" class="form" novalidate>
      <label class="form__label" for="login-email" data-i18n="emailLabel"></label>
      <input id="login-email" class="form__input" type="email" autocomplete="username" inputmode="email" required>

      <label class="form__label" for="login-password" data-i18n="passwordLabel"></label>
      <input id="login-password" class="form__input" type="password" autocomplete="current-password" required>

      <label class="check">
        <input id="show-password" type="checkbox">
        <span data-i18n="showPassword"></span>
      </label>

      <p id="login-error" class="form__error" role="alert" hidden></p>
      <button id="login-button" class="btn btn--primary" type="submit" data-i18n="logIn"></button>
    </form>

    <button id="forgot-password" class="btn btn--link" type="button" data-i18n="forgotPassword"></button>
    <p id="login-message" class="screen__message" role="status" hidden></p>
  </section>

  <!-- Screen: account isn't allowed, or something went wrong -->
  <section id="screen-problem" class="screen" hidden>
    <h1 id="problem-title" class="screen__title"></h1>
    <p id="problem-text" class="screen__intro"></p>
    <button id="problem-retry" class="btn btn--primary" type="button" data-i18n="tryAgain" hidden></button>
    <button id="problem-logout" class="btn" type="button" data-i18n="logOut"></button>
  </section>

  <!-- Screen: the menu manager -->
  <section id="screen-manager" class="screen screen--wide" hidden>
    <header class="topbar">
      <div>
        <h1 class="topbar__title" data-i18n="appName"></h1>
        <p id="logged-in-as" class="topbar__user"></p>
      </div>
      <button id="logout-button" class="btn btn--small" type="button" data-i18n="logOut"></button>
    </header>

    <div class="toolbar">
      <label class="form__label" for="dish-search" data-i18n="searchLabel"></label>
      <input id="dish-search" class="form__input" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder">
      <div class="toolbar__actions">
        <button id="add-dish" class="btn btn--primary" type="button" data-i18n="addDish"></button>
        <button id="order-mode" class="btn" type="button" aria-pressed="false" data-i18n="changeOrder"></button>
      </div>
      <p id="order-hint" class="toolbar__hint" data-i18n="orderHint" hidden></p>
    </div>

    <div id="dish-list" class="dish-list"></div>
    <p id="no-matches" class="dish-list__empty" data-i18n="noMatches" hidden></p>

    <section class="more" aria-labelledby="more-title">
      <h2 id="more-title" class="more__title" data-i18n="moreTitle"></h2>
      <button id="open-sections" class="btn" type="button" data-i18n="sectionsButton"></button>
      <button id="open-details" class="btn" type="button" data-i18n="detailsButton"></button>
      <button id="download-backup" class="btn" type="button" data-i18n="backupButton"></button>
      <p class="more__hint" data-i18n="backupHint"></p>
      <a class="btn btn--link" href="./" target="_blank" rel="noopener" data-i18n="viewMenu"></a>
    </section>
  </section>

  <!-- Full-screen form: add / edit a dish -->
  <section id="screen-dish" class="sheet" role="dialog" aria-modal="true" aria-labelledby="dish-form-title" hidden>
    <form id="dish-form" class="sheet__form" novalidate>
      <h2 id="dish-form-title" class="sheet__title"></h2>

      <label class="form__label" for="dish-name" data-i18n="nameLabel"></label>
      <input id="dish-name" class="form__input" type="text" maxlength="60" autocomplete="off" required>

      <label class="form__label" for="dish-category" data-i18n="categoryLabel"></label>
      <select id="dish-category" class="form__input"></select>

      <label class="form__label" for="dish-price" data-i18n="priceLabel"></label>
      <input id="dish-price" class="form__input" type="text" inputmode="numeric" autocomplete="off" required>

      <label class="form__label" for="dish-price-large" data-i18n="priceLargeLabel"></label>
      <input id="dish-price-large" class="form__input" type="text" inputmode="numeric" autocomplete="off" aria-describedby="dish-price-large-hint">
      <p class="form__hint" id="dish-price-large-hint" data-i18n="priceLargeHint"></p>

      <label class="form__label" for="dish-description" data-i18n="descriptionLabel"></label>
      <textarea id="dish-description" class="form__input form__textarea" rows="3" maxlength="150" aria-describedby="dish-description-count"></textarea>
      <p class="form__count" id="dish-description-count" aria-live="polite"></p>

      <!-- Tag names are the owner's own (filled in by js/admin.js from the settings). -->
      <label class="check"><input id="dish-spicy" type="checkbox"><svg class="icon icon--spicy check__icon" aria-hidden="true" focusable="false"><use href="#icon-flame"/></svg><span id="dish-spicy-label"></span></label>
      <label class="check"><input id="dish-veg" type="checkbox"><svg class="icon icon--veg check__icon" aria-hidden="true" focusable="false"><use href="#icon-leaf"/></svg><span id="dish-veg-label"></span></label>
      <label class="check"><input id="dish-featured" type="checkbox"><svg class="icon icon--featured check__icon" aria-hidden="true" focusable="false"><use href="#icon-star"/></svg><span id="dish-featured-label"></span></label>

      <p id="dish-error" class="form__error" role="alert" hidden></p>

      <div class="sheet__actions">
        <button id="dish-save" class="btn btn--primary" type="submit" data-i18n="save"></button>
        <button id="dish-cancel" class="btn" type="button" data-i18n="cancel"></button>
      </div>
      <button id="dish-delete" class="btn btn--danger" type="button" data-i18n="deleteDish" hidden></button>
    </form>
  </section>

  <!-- Full-screen list: menu sections -->
  <section id="screen-sections" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sections-title" hidden>
    <div class="sheet__form">
      <h2 id="sections-title" class="sheet__title" data-i18n="sectionsTitle"></h2>
      <p class="form__hint sheet__intro" data-i18n="sectionsIntro"></p>
      <button id="add-section" class="btn btn--primary" type="button" data-i18n="addSection"></button>
      <ul id="section-list" class="dish-rows section-list"></ul>
      <div class="sheet__actions">
        <button id="sections-done" class="btn" type="button" data-i18n="done"></button>
      </div>
    </div>
  </section>

  <!-- Small full-screen form: add / rename a section -->
  <section id="screen-section" class="sheet" role="dialog" aria-modal="true" aria-labelledby="section-form-title" hidden>
    <form id="section-form" class="sheet__form" novalidate>
      <h2 id="section-form-title" class="sheet__title"></h2>
      <label class="form__label" for="section-name" data-i18n="sectionNameLabel"></label>
      <input id="section-name" class="form__input" type="text" maxlength="30" autocomplete="off" aria-describedby="section-name-hint" required>
      <p class="form__hint" id="section-name-hint"></p>
      <p id="section-error" class="form__error" role="alert" hidden></p>
      <div class="sheet__actions">
        <button id="section-save" class="btn btn--primary" type="submit" data-i18n="save"></button>
        <button id="section-cancel" class="btn" type="button" data-i18n="cancel"></button>
      </div>
    </form>
  </section>

  <!-- Confirmation: delete a section that has dishes -->
  <section id="screen-delete-section" class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="delete-section-title" aria-describedby="delete-section-text" hidden>
    <div class="sheet__form">
      <h2 id="delete-section-title" class="sheet__title"></h2>
      <p id="delete-section-text" class="sheet__intro" data-i18n="deleteWithDishesText"></p>
      <ul id="delete-section-dishes" class="delete-list"></ul>
      <p id="delete-section-more" class="form__hint" hidden></p>
      <button id="delete-section-confirm" class="btn btn--danger" type="button"></button>
      <button id="delete-section-hide" class="btn" type="button" data-i18n="hideInstead"></button>
      <button id="delete-section-cancel" class="btn" type="button" data-i18n="cancel"></button>
    </div>
  </section>

  <!-- Full-screen form: restaurant details -->
  <section id="screen-details" class="sheet" role="dialog" aria-modal="true" aria-labelledby="details-title" hidden>
    <form id="details-form" class="sheet__form" novalidate>
      <h2 id="details-title" class="sheet__title" data-i18n="detailsTitle"></h2>

      <label class="form__label" for="set-tagline" data-i18n="taglineLabel"></label>
      <input id="set-tagline" class="form__input" type="text" maxlength="60" autocomplete="off" aria-describedby="set-tagline-hint set-tagline-count">
      <p class="form__hint" id="set-tagline-hint" data-i18n="taglineHint"></p>
      <p class="form__count" id="set-tagline-count" aria-live="polite"></p>

      <label class="form__label" for="set-notice" data-i18n="noticeLabel"></label>
      <input id="set-notice" class="form__input" type="text" maxlength="120" aria-describedby="set-notice-hint">
      <p class="form__hint" id="set-notice-hint" data-i18n="noticeHint"></p>

      <label class="form__label" for="set-hours" data-i18n="hoursLabel"></label>
      <textarea id="set-hours" class="form__input form__textarea" rows="2" maxlength="150"></textarea>

      <label class="form__label" for="set-phone" data-i18n="phoneLabel"></label>
      <input id="set-phone" class="form__input" type="tel" maxlength="30" autocomplete="off" aria-describedby="set-phone-hint">
      <p class="form__hint" id="set-phone-hint" data-i18n="phoneHint"></p>

      <label class="form__label" for="set-whatsapp" data-i18n="whatsappLabel"></label>
      <input id="set-whatsapp" class="form__input" type="tel" maxlength="30" autocomplete="off" aria-describedby="set-whatsapp-hint">
      <p class="form__hint" id="set-whatsapp-hint" data-i18n="whatsappHint"></p>

      <label class="form__label" for="set-email" data-i18n="emailDetailLabel"></label>
      <input id="set-email" class="form__input" type="email" maxlength="146" inputmode="email" autocomplete="off">

      <label class="form__label" for="set-address" data-i18n="addressLabel"></label>
      <textarea id="set-address" class="form__input form__textarea" rows="2" maxlength="150"></textarea>

      <label class="form__label" for="set-map" data-i18n="mapLabel"></label>
      <input id="set-map" class="form__input" type="url" maxlength="300" inputmode="url" autocomplete="off" aria-describedby="set-map-hint">
      <p class="form__hint" id="set-map-hint" data-i18n="mapHint"></p>

      <label class="form__label" for="set-facebook" data-i18n="facebookLabel"></label>
      <input id="set-facebook" class="form__input" type="url" maxlength="300" inputmode="url" autocomplete="off" aria-describedby="set-facebook-hint">
      <p class="form__hint" id="set-facebook-hint" data-i18n="facebookHint"></p>

      <!-- Dish tags: the icons never change, only the names customers see. -->
      <fieldset class="form__group">
        <legend class="form__group-title" data-i18n="tagsTitle"></legend>
        <p class="form__hint" data-i18n="tagsIntro"></p>

        <label class="form__label form__label--icon" for="set-tag-spicy"><svg class="icon icon--spicy" aria-hidden="true" focusable="false"><use href="#icon-flame"/></svg><span data-i18n="tagSpicyLabel"></span></label>
        <input id="set-tag-spicy" class="form__input" type="text" maxlength="20" autocomplete="off">

        <label class="form__label form__label--icon" for="set-tag-veg"><svg class="icon icon--veg" aria-hidden="true" focusable="false"><use href="#icon-leaf"/></svg><span data-i18n="tagVegLabel"></span></label>
        <input id="set-tag-veg" class="form__input" type="text" maxlength="20" autocomplete="off" aria-describedby="set-tag-veg-hint">
        <p class="form__hint" id="set-tag-veg-hint" data-i18n="tagVegHint"></p>

        <label class="form__label form__label--icon" for="set-tag-special"><svg class="icon icon--featured" aria-hidden="true" focusable="false"><use href="#icon-star"/></svg><span data-i18n="tagSpecialLabel"></span></label>
        <input id="set-tag-special" class="form__input" type="text" maxlength="20" autocomplete="off">

        <button id="tags-reset" class="btn btn--link" type="button" data-i18n="tagsReset"></button>
      </fieldset>

      <p id="details-error" class="form__error" role="alert" hidden></p>

      <div class="sheet__actions">
        <button id="details-save" class="btn btn--primary" type="submit" data-i18n="save"></button>
        <button id="details-cancel" class="btn" type="button" data-i18n="cancel"></button>
      </div>
    </form>
  </section>

  <noscript><p class="noscript">Please turn on JavaScript to manage the menu.</p></noscript>
</body>
</html>
